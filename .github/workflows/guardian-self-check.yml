name: Guardian Self Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guardian-self-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Resolve Guardian base
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="main"
          fi
          echo "GUARDIAN_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"

      - name: Guardian Summary
        continue-on-error: true
        run: |
          npm run guardian -- \
            --repo . \
            --base "$GUARDIAN_BASE" \
            --out guardian-summary.md \
            --summary-only

      - name: Add Summary
        if: always()
        run: |
          if [ -f guardian-summary.md ]; then
            cat guardian-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardian Full Report
        if: always()
        continue-on-error: true
        run: |
          npm run guardian -- \
            --repo . \
            --base "$GUARDIAN_BASE" \
            --out guardian-report.md \
            --full-report

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-report
          path: guardian-report.md