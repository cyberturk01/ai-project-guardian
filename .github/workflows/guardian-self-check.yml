name: Guardian Self Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guardian-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Guardian
        continue-on-error: true
        run: npm run guardian -- --repo . --out guardian-report.md

      - name: Add report to summary
        if: always()
        run: |
          if [ -f guardian-report.md ]; then
            cat guardian-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Guardian did not generate guardian-report.md." >> "$GITHUB_STEP_SUMMARY"
          fi